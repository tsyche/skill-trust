name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with ruff ruff check .
      - run: uv run --with ruff ruff format --check .
      - run: uv run --with pytest pytest -q
